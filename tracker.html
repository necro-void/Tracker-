<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Task Manager</title>
    <style>
        /* Your original styles remain exactly the same */
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1E1E1E;
            --bg-elevated: #242424;
            --text-primary: #FFFFFF;
            --text-secondary: #B3B3B3;
            --accent-color: #4A90E2;
            --danger-color: #dc3545;
            --border-color: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: var(--bg-secondary);
            padding: 20px;
            border-radius: 10px;
        }

        h1, h2, h3 {
            text-align: center;
            margin-bottom: 20px;
        }

        .section {
            background-color: var(--bg-elevated);
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .date-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 8px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        button {
            padding: 8px 16px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .delete-btn {
            background-color: var(--danger-color);
        }

        .task {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px;
            background-color: var(--bg-primary);
            border-radius: 4px;
            margin-bottom: 5px;
        }

        .task.completed span {
            text-decoration: line-through;
            color: var(--text-secondary);
        }

        .task-actions {
            margin-left: auto;
            display: flex;
            gap: 5px;
        }

        #currentDate {
            color: var(--accent-color);
            font-weight: bold;
        }

        .water-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .category-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .add-task-form {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .add-task-form input {
            margin-bottom: 0;
        }

        .add-category-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .add-category-form button {
            grid-column: span 2;
        }

        @media (max-width: 600px) {
            .add-category-form {
                grid-template-columns: 1fr;
            }
            
            .add-category-form button {
                grid-column: 1;
            }

            .add-task-form {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Task Manager</h1>

        <div class="date-controls">
            <button onclick="previousDay()">Previous Day</button>
            <span id="currentDate"></span>
            <button onclick="nextDay()">Next Day</button>
        </div>

        <div class="section">
            <h2>Water Intake</h2>
            <p>Goal: <span id="waterGoal">3000</span>ml</p>
            <p>Current: <span id="waterCurrent">0</span>ml</p>
            <div class="water-controls">
                <button onclick="updateWater(250)">+250ml</button>
                <button onclick="updateWater(500)">+500ml</button>
                <button onclick="updateWater(-250)">-250ml</button>
            </div>
        </div>

        <div class="section">
            <h2>Add New Category</h2>
            <div class="add-category-form">
                <input type="text" id="newCategoryName" placeholder="Category Name">
                <input type="text" id="newCategoryTime" placeholder="Time Slot (e.g., 9 AM - 5 PM)">
                <button onclick="addCategory()">Add Category</button>
            </div>
        </div>

        <div id="categoriesContainer"></div>

        <div class="section">
            <h2>Daily Notes</h2>
            <textarea id="dailyNotes" placeholder="Write your notes for today..."></textarea>
        </div>
    </div>

    <script>
        // Add these new functions for localStorage management
        function saveState() {
            const stateKey = `taskManager_${state.currentDate}`;
            localStorage.setItem(stateKey, JSON.stringify(state));
        }

        function loadState(date) {
            const stateKey = `taskManager_${date}`;
            const savedState = localStorage.getItem(stateKey);
            
            if (savedState) {
                state = JSON.parse(savedState);
            } else {
                // Reset to default template categories
                state.currentDate = date;
                state.categories = [
                    { id: 1, name: 'Morning Routine', timeSlot: '9 AM - 3 PM', tasks: [] },
                    { id: 2, name: 'Work Tasks', timeSlot: '3 PM - 6 PM', tasks: [] },
                    { id: 3, name: 'Evening Routine', timeSlot: '6 PM - 9 PM', tasks: [] },
                    { id: 4, name: 'NIGHT Routine', timeSlot: '9 PM - 12 PM', tasks: [] }
                ];
                state.waterIntake = 0;
                state.nextId = 5;
                state.dailyNotes[date] = '';
            }
        }

        // Your original state object
        const state = {
            currentDate: new Date().toISOString().split('T')[0],
            categories: [
                { id: 1, name: 'Morning Routine', timeSlot: '9 AM - 3 PM', tasks: [] },
                { id: 2, name: 'Work Tasks', timeSlot: '3 PM - 6 PM', tasks: [] },
                { id: 3, name: 'Evening Routine', timeSlot: '6 PM - 9 PM', tasks: [] },
                { id: 4, name: 'NIGHT Routine', timeSlot: '9 PM - 12 PM', tasks: [] }
            ],
            waterIntake: 0,
            waterGoal: 3000,
            dailyNotes: {},
            nextId: 4
        };

        function addCategory() {
            const nameInput = document.getElementById('newCategoryName');
            const timeInput = document.getElementById('newCategoryTime');
            
            const name = nameInput.value.trim();
            const timeSlot = timeInput.value.trim();

            if (!name || !timeSlot) {
                alert('Please fill in both fields');
                return;
            }

            state.categories.push({
                id: state.nextId++,
                name,
                timeSlot,
                tasks: []
            });

            nameInput.value = '';
            timeInput.value = '';
            renderCategories();
            saveState(); // Add save after modification
        }

        function deleteCategory(id) {
            if (confirm('Are you sure you want to delete this category?')) {
                state.categories = state.categories.filter(c => c.id !== id);
                renderCategories();
                saveState(); // Add save after modification
            }
        }

        function addTask(categoryId) {
            const input = document.getElementById(`taskInput-${categoryId}`);
            const taskName = input.value.trim();
            
            if (!taskName) return;

            const category = state.categories.find(c => c.id === categoryId);
            if (category) {
                category.tasks.push({
                    id: Date.now(),
                    name: taskName,
                    completed: false
                });
                input.value = '';
                renderCategories();
                saveState(); // Add save after modification
            }
        }

        function toggleTask(categoryId, taskId) {
            const category = state.categories.find(c => c.id === categoryId);
            if (category) {
                const task = category.tasks.find(t => t.id === taskId);
                if (task) {
                    task.completed = !task.completed;
                    renderCategories();
                    saveState(); // Add save after modification
                }
            }
        }

        function deleteTask(categoryId, taskId) {
            const category = state.categories.find(c => c.id === categoryId);
            if (category) {
                category.tasks = category.tasks.filter(t => t.id !== taskId);
                renderCategories();
                saveState(); // Add save after modification
            }
        }

        function editCategory(id) {
            const category = state.categories.find(c => c.id === id);
            if (!category) return;

            const newName = prompt('Enter new category name:', category.name);
            if (newName && newName.trim()) {
                const newTime = prompt('Enter new time slot:', category.timeSlot);
                if (newTime && newTime.trim()) {
                    category.name = newName.trim();
                    category.timeSlot = newTime.trim();
                    renderCategories();
                    saveState(); // Add save after modification
                }
            }
        }

        function renderCategories() {
            const container = document.getElementById('categoriesContainer');
            container.innerHTML = '';

            state.categories.forEach(category => {
                const div = document.createElement('div');
                div.className = 'section';
                div.innerHTML = `
                    <div class="category-header">
                        <h3 ondblclick="editCategory(${category.id})">${category.name} (${category.timeSlot})</h3>
                        <button class="delete-btn" onclick="deleteCategory(${category.id})">Delete Category</button>
                    </div>
                    <div class="add-task-form">
                        <input type="text" id="taskInput-${category.id}" 
                               placeholder="Add a new task">
                        <button onclick="addTask(${category.id})">Add Task</button>
                    </div>
                    <div class="tasks">
                        ${category.tasks.map(task => `
                            <div class="task ${task.completed ? 'completed' : ''}">
                                <input type="checkbox" ${task.completed ? 'checked' : ''} 
                                       onchange="toggleTask(${category.id}, ${task.id})">
                                <span>${task.name}</span>
                                <div class="task-actions">
                                    <button class="delete-btn" 
                                            onclick="deleteTask(${category.id}, ${task.id})">Delete</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateDateDisplay() {
            const dateElement = document.getElementById('currentDate');
            const date = new Date(state.currentDate);
            dateElement.textContent = date.toLocaleDateString('en-US', { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            });
            
            // Update water and notes display
            document.getElementById('waterCurrent').textContent = state.waterIntake;
            const notesTextarea = document.getElementById('dailyNotes');
            notesTextarea.value = state.dailyNotes[state.currentDate] || '';
        }

        function previousDay() {
            saveState(); // Save current state
            const date = new Date(state.currentDate);
            date.setDate(date.getDate() - 1);
            state.currentDate = date.toISOString().split('T')[0];
            loadState(state.currentDate); // Load state for new date
            updateDateDisplay();
            renderCategories();
        }

        function nextDay() {
            saveState(); // Save current state
            const date = new Date(state.currentDate);
            date.setDate(date.getDate() + 1);
            state.currentDate = date.toISOString().split('T')[0];
            loadState(state.currentDate); // Load state for new date
            updateDateDisplay();
            renderCategories();
        }

        function updateWater(amount) {
            const newAmount = state.waterIntake + amount;
            if (newAmount >= 0 && newAmount <= state.waterGoal) {
                state.waterIntake = newAmount;
                document.getElementById('waterCurrent').textContent = newAmount;
                saveState(); // Add save after modification
            }
        }

        function setupNotesListener() {
            const notesTextarea = document.getElementById('dailyNotes');
            notesTextarea.addEventListener('input', () => {
                state.dailyNotes[state.currentDate] = notesTextarea.value;
                saveState(); // Add save after modification
            });
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadState(state.currentDate); // Load any saved state
            updateDateDisplay();
            renderCategories();
            setupNotesListener();
        });
    </script>
</body>
</html>
